[package]
name = "armature-webhooks"
version = "0.5.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-webhooks"
homepage = "https://quinnjr.github.io/armature"
description = "Webhook sending and receiving for Armature"
keywords = ["webhooks", "events", "http", "notifications"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Core dependencies
armature-core = { version = "0.10" }
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"

# Async runtime
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
# Fan-out clones the serialized payload once per endpoint; `Bytes` makes that a
# refcount bump instead of a full copy of the body per subscriber.
bytes = "1.12"

# HTTP client for outgoing webhooks
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptographic signatures
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Unique identifiers
uuid = { version = "1.26", features = ["v4", "serde"] }

# URL parsing
url = "2.5"

# SSRF guard (EgressPolicy) shared with armature-push
armature-http-client = { version = "0.2" }

# Webhook signing-secret generation (32 bytes from the OS CSPRNG)
getrandom = "0.3"

[features]
default = []
# Allows `WebhookConfig::verify_ssl(false)` (accept invalid TLS certificates).
# Never enable in production: it lets anyone on the path impersonate every
# webhook receiver.
dangerous-insecure-tls = []

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
wiremock = "0.6"

